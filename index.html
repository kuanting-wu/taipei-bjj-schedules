<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大台北柔術課表 · Gi / No-Gi / Rolling</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --border: #2d3a4d;
    --text: #e7ecf3;
    --muted: #8b9bb4;
    --gi: #3b82f6;
    --nogi: #22c55e;
    --roll: #f59e0b;
    --accent: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.45;
  }
  header {
    padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #1a2332, var(--bg));
  }
  header h1 { margin: 0 0 .35rem; font-size: 1.35rem; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  .controls {
    display: flex; flex-wrap: wrap; gap: .75rem; padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .controls label { font-size: .8rem; color: var(--muted); display: flex; flex-direction: column; gap: .25rem; }
  select, input[type="search"] {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: .45rem .65rem; min-width: 140px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 999px; padding: .35rem .75rem; cursor: pointer; font-size: .85rem;
  }
  .chip.on { outline: 2px solid var(--accent); }
  .chip.gi.on { outline-color: var(--gi); }
  .chip.nogi.on { outline-color: var(--nogi); }
  .chip.roll.on { outline-color: var(--roll); }
  .legend { display: flex; gap: .75rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .dot { width: .65rem; height: .65rem; border-radius: 50%; display: inline-block; margin-right: .25rem; }
  .dot.gi { background: var(--gi); }
  .dot.nogi { background: var(--nogi); }
  .dot.roll { background: var(--roll); }
  main { padding: 1rem 1.5rem 3rem; }
  .view-tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .view-tabs button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: .5rem 1rem; border-radius: 8px; cursor: pointer;
  }
  .view-tabs button.active { background: #2a3550; border-color: var(--accent); }
  .matrix-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
  table.matrix { border-collapse: collapse; width: 100%; min-width: 900px; font-size: .82rem; }
  table.matrix th, table.matrix td {
    border: 1px solid var(--border); padding: .5rem; vertical-align: top;
    background: var(--card);
  }
  table.matrix th { position: sticky; top: 0; z-index: 2; background: #243044; }
  table.matrix th.day { left: 0; z-index: 3; min-width: 3.2rem; }
  table.matrix td.day { position: sticky; left: 0; background: #1e293b; font-weight: 600; }
  .slot { margin: .2rem 0; padding: .25rem .4rem; border-radius: 6px; font-size: .78rem; }
  .slot.gi { background: rgba(59,130,246,.2); border-left: 3px solid var(--gi); }
  .slot.nogi { background: rgba(34,197,94,.2); border-left: 3px solid var(--nogi); }
  .slot.roll { background: rgba(245,158,11,.22); border-left: 3px solid var(--roll); }
  .slot.unknown { background: rgba(139,155,180,.15); border-left: 3px solid var(--muted); }
  .empty { color: var(--muted); }
  .gym-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .gym-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem; cursor: pointer; transition: border-color .15s;
  }
  .gym-card:hover { border-color: var(--accent); }
  .gym-card h3 { margin: 0 0 .35rem; font-size: 1.05rem; }
  .gym-card .meta { color: var(--muted); font-size: .85rem; margin-bottom: .75rem; }
  .tags { display: flex; gap: .35rem; flex-wrap: wrap; }
  .tag { font-size: .72rem; padding: .15rem .45rem; border-radius: 999px; border: 1px solid var(--border); }
  .tag.gi { color: #93c5fd; border-color: var(--gi); }
  .tag.nogi { color: #86efac; border-color: var(--nogi); }
  .tag.roll { color: #fcd34d; border-color: var(--roll); }
  #detail {
    display: none; margin-top: 1.25rem; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem;
  }
  #detail.open { display: block; }
  #detail h2 { margin: 0 0 .5rem; }
  #detail .links a { color: var(--accent); margin-right: 1rem; font-size: .9rem; }
  #detail img {
    max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: .75rem;
  }
  .day-list { display: grid; gap: .75rem; }
  .day-block { border: 1px solid var(--border); border-radius: 10px; padding: .75rem 1rem; background: #15202e; }
  .day-block h4 { margin: 0 0 .5rem; }
  footer { padding: 1rem 1.5rem 2rem; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--border); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>大台北柔術課表 · 三維瀏覽</h1>
  <p>星期 × 道館 × Gi／No-Gi／Rolling　·　資料截至 2026-10-02　·　點格子或卡片看來源與課表圖</p>
</header>

<div class="controls">

  </label>
  <label>搜尋

  <div>
    <div class="legend" style="margin-bottom:.35rem">類型（可多選）</div>
    <div class="chips">
      <button type="button" class="chip gi on" data-type="gi"><span class="dot gi"></span>Gi</button>
      <button type="button" class="chip nogi on" data-type="nogi"><span class="dot nogi"></span>No-Gi</button>
      <button type="button" class="chip roll on" data-type="roll"><span class="dot roll"></span>Rolling</button>
      <button type="button" class="chip on" data-type="unknown">未標清</button>
    </div>
  </div>
</div>

<main>
  <div class="view-tabs">
    <button type="button" class="active" data-view="matrix">矩陣（星期×道館）</button>
    <button type="button" data-view="cards">道館卡片</button>

  <div id="dayView" style="display:none"></div>
  <div id="detail"></div>
</main>

<footer>
  來源為各館官網／IG／FB 公開課表；時段可能異動，請以道館最新公告為準。

const state = {
  day: "all",
  gym: "all",
  types: new Set(["gi","nogi","roll","unknown"]),
  q: "",
  view: "matrix"
};

const gymById = Object.fromEntries(GYMS.map(g => [g.id, g]));

function filteredSlots() {
  const q = state.q.trim().toLowerCase();
  return SLOTS.filter(s => {
    if (state.day !== "all" && s.d !== state.day) return false;
    if (state.gym !== "all" && s.g !== state.gym) return false;
    if (!state.types.has(s.t)) return false;
    if (q) {
      const g = gymById[s.g];
      const blob = `${g.name} ${s.title} ${s.time} ${s.t}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function typeLabel(t) {
  return ({gi:"Gi",nogi:"No-Gi",roll:"Rolling",unknown:"未標清"})[t] || t;
}

function showDetail(gymId) {
  const g = gymById[gymId];
  if (!g) return;
  const el = document.getElementById("detail");
  const links = g.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join("");
  const img = g.image ? `<img src="${g.image}" alt="${g.name} 課表" />` : `<p class="empty">無課表截圖（見來源連結）</p>`;
  const slots = SLOTS.filter(s => s.g === gymId);
  const byDay = DAYS.map(d => {
    const list = slots.filter(s => s.d === d);
    if (!list.length) return "";
    return `<div class="day-block"><h4>星期${d}</h4>${list.map(s =>
      `<div class="slot ${s.t}"><strong>${typeLabel(s.t)}</strong> ${s.time} · ${s.title}</div>`
    ).join("")}</div>`;
  }).join("");
  el.className = "open";
  el.innerHTML = `
    <h2>${g.name} <span style="color:var(--muted);font-size:.9rem">${g.district}</span></h2>
    <p class="meta">${g.note || ""}</p>
    <div class="links"><strong>資料來源：</strong>${links}</div>
    ${img}
    <h3 style="margin-top:1rem">完整時段</h3>
    <div class="day-list">${byDay || "<p class='empty'>無資料</p>"}</div>
  `;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderMatrix() {
  const slots = filteredSlots();
  const gymIds = state.gym === "all" ? GYMS.map(g => g.id) : [state.gym];
  const days = state.day === "all" ? DAYS : [state.day];
  let html = `<div class="matrix-wrap"><table class="matrix"><thead><tr><th class="day">星期</th>`;
  gymIds.forEach(id => {
    const g = gymById[id];
    html += `<th><button type="button" class="chip" style="width:100%" data-open="${id}">${g.name}</button></th>`;
  });
  html += `</tr></thead><tbody>`;
  days.forEach(d => {
    html += `<tr><td class="day">${d}</td>`;
    gymIds.forEach(id => {
      const cell = slots.filter(s => s.d === d && s.g === id);
      html += `<td data-open="${id}">`;
      if (!cell.length) html += `<span class="empty">—</span>`;
      else cell.forEach(s => {
        html += `<div class="slot ${s.t}"><strong>${typeLabel(s.t)}</strong> ${s.time}<br/>${s.title}</div>`;
      });
      html += `</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  document.getElementById("matrixView").innerHTML = html;
}

function renderCards() {
  const slots = filteredSlots();
  const gymIds = [...new Set(slots.map(s => s.g))];
  const list = (state.gym === "all" ? GYMS : GYMS.filter(g => g.id === state.gym))
    .filter(g => state.gym !== "all" || gymIds.includes(g.id) || !state.q);
  document.getElementById("cardsView").innerHTML = `<div class="gym-grid">${list.map(g => {
    const gs = slots.filter(s => s.g === g.id);
    const has = new Set(gs.map(s => s.t));
    return `<div class="gym-card" data-open="${g.id}">
      <h3>${g.name}</h3>
      <div class="meta">${g.district}${g.note ? " · " + g.note : ""}</div>
      <div class="tags">
        ${has.has("gi") ? '<span class="tag gi">Gi</span>' : ""}
        ${has.has("nogi") ? '<span class="tag nogi">No-Gi</span>' : ""}
        ${has.has("roll") ? '<span class="tag roll">Rolling</span>' : ""}
      </div>
      <p style="font-size:.8rem;color:var(--muted);margin:.75rem 0 0">來源 ${g.sources.length} 筆 · 點開看圖與連結</p>
    </div>`;
  }).join("")}</div>`;
}

function renderDay() {
  const slots = filteredSlots();
  const days = state.day === "all" ? DAYS : [state.day];
  document.getElementById("dayView").innerHTML = `<div class="day-list">${days.map(d => {
    const list = slots.filter(s => s.d === d);
    return `<div class="day-block"><h4>星期${d}</h4>
      ${list.length ? list.map(s => {
        const g = gymById[s.g];
        return `<div class="slot ${s.t}" data-open="${s.g}" style="cursor:pointer">
          <strong>${g.name}</strong> · ${typeLabel(s.t)} · ${s.time} · ${s.title}
        </div>`;
      }).join("") : '<span class="empty">—</span>'}
    </div>`;
  }).join("")}</div>`;
}

function render() {
  renderMatrix();
  renderCards();
  renderDay();
  document.getElementById("matrixView").style.display = state.view === "matrix" ? "" : "none";
  document.getElementById("cardsView").style.display = state.view === "cards" ? "" : "none";
  document.getElementById("dayView").style.display = state.view === "day" ? "" : "none";
}

// init gym filter
const gf = document.getElementById("gymFilter");
GYMS.forEach(g => {
  const o = document.createElement("option");
  o.value = g.id; o.textContent = g.name;
  gf.appendChild(o);
});

document.getElementById("dayFilter").onchange = e => { state.day = e.target.value; render(); };
gf.onchange = e => { state.gym = e.target.value; render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };

document.querySelectorAll(".chips .chip").forEach(btn => {
  btn.onclick = () => {
    const t = btn.dataset.type;
    if (state.types.has(t)) state.types.delete(t); else state.types.add(t);
    btn.classList.toggle("on", state.types.has(t));
    render();
  };
});

document.querySelectorAll(".view-tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".view-tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.view = btn.dataset.view;
    render();
  };
});

document.body.addEventListener("click", e => {
  const t = e.target.closest("[data-open]");
  if (t) showDetail(t.dataset.open);
});

render();
</script>
</body>
</html>
